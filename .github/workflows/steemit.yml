name: Steemit Auto Writer & Post

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"   # 毎朝 10:00 JST

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run Steemit Auto Post
        env:
          STEEM_POST_KEY: ${{ secrets.STEEM_POST_KEY }}
          STEEM_AUTHOR: ${{ secrets.STEEM_AUTHOR }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/post.js
