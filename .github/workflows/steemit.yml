name: Steemit Auto Writer & Post

on:
  schedule:
    - cron: '0 1 * * *'   # JST 10:00（UTC 01:00）
  workflow_dispatch:

jobs:
  auto_post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - run: npm install

      # 多言語記事生成
      - name: Generate Multilingual Article
        run: node generate.js
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # Steemit 投稿
      - name: Post to Steemit
        run: node post.js
        env:
          STEEM_POST_KEY: ${{ secrets.STEEM_POST_KEY }}
          STEEM_AUTHOR: ${{ secrets.STEEM_AUTHOR }}
