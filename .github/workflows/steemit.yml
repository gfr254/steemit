name: Steemit Auto Writer & Post

on:
  schedule:
    - cron: "7 1 * * *"   # JST 10:07（最も安定）
  workflow_dispatch:

jobs:
  auto_post:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: |
          npm install

      - name: Generate article (整備固定)
        run: |
          node scripts/generate.js

      - name: Post to Steemit
        run: |
          node scripts/post.js
