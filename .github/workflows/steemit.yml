name: Steemit Auto Writer & Post

on:
  schedule:
    - cron: "0 1 * * *"   # JST 10:00（GitHubはUTC）
  workflow_dispatch:

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  STEEM_POST_KEY: ${{ secrets.STEEM_POST_KEY }}
  ACTIONS_RUNNER_FORCE_NODE_VERSION: 24

jobs:
  auto-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Generate article
        run: node scripts/generate.js

      - name: Post article
        run: node scripts/post.js

      - name: Completed
        run: echo "Steemit 自動投稿 完了"
