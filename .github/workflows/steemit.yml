name: Steemit Auto Writer & Post

on:
  schedule:
    - cron: "7 1 * * *"   # JST 10:07 — duplicate correction
    - cron: "7 13 * * *"  # JST 22:07 — normal article
  workflow_dispatch:

jobs:
  auto_post:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      STEEM_POST_KEY: ${{ secrets.STEEM_POST_KEY }}
      STEEM_AUTHOR: ${{ secrets.STEEM_AUTHOR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: |
          npm install

      - name: Generate duplicate correction
        if: github.event.schedule == '7 1 * * *'
        run: node scripts/generate.js correction

      - name: Post duplicate correction
        if: github.event.schedule == '7 1 * * *'
        run: node scripts/post.js

      - name: Generate normal daily article
        if: github.event.schedule == '7 13 * * *' || github.event_name == 'workflow_dispatch'
        run: node scripts/generate.js regular

      - name: Post normal daily article
        if: github.event.schedule == '7 13 * * *' || github.event_name == 'workflow_dispatch'
        run: node scripts/post.js
