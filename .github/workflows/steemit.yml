name: Steemit Auto Writer & Post

on:
  schedule:
    - cron: '7 1 * * *'   # JST 10:07（最も安定）
  workflow_dispatch:

jobs:
  auto_post:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 1
      retry:
        max: 3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - run: npm install

      - name: Generate Article
        run: node generate.js

      - name: Post to Steemit
        run: node post.js
